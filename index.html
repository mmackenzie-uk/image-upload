<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    canvas { border: 2px solid #111; float: left; }
    img { border: 2px solid #00f; float: left; margin-left: 10px; }
</style>
<body>
    <h1>HTML5 Canvas to Image</h1>
    <button id="btnDisplay">Display</button>
    <button id="btnDownload">Download</button>
    <canvas id="myCanvas" width="400" height="250"></canvas>
    <img src="" id="imgConverted" />
   
    <script>
        const btnDisplay = document.querySelector("#btnDisplay");
        const btnDownload = document.querySelector("#btnDownload");
        const imgConverted = document.querySelector("#imgConverted");
        const myCanvas = document.querySelector("#myCanvas");

        const ctx = myCanvas.getContext("2d");
        ctx.font = "50px Roboto";
        ctx.fillStyle = "red";
        ctx.fillText("dcode", 100, 100);
        ctx.fillRect(200, 150, 150, 75);

        btnDisplay.addEventListener("click", function() {
            const dataURI = myCanvas.toDataURL();
            imgConverted.src = dataURI;
        });

        btnDownload.addEventListener("click", function() {
            const a = document.createElement("a");
            document.body.appendChild(a);
            a.href = myCanvas.toDataURL();
            a.download = "canvas-image.png";
            a.click();
        })
    </script>
</body>
</html>
